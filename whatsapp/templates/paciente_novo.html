{% extends "base.html" %}
{% block titulo %}Novo paciente{% endblock %}
{% block conteudo %}
<a href="{{ base }}/pacientes" class="text-sm text-slate-500 hover:text-slate-800">← Pacientes</a>
<h1 class="text-2xl font-semibold mt-2 mb-4">Novo paciente</h1>
<form method="post" class="bg-white rounded-xl border border-slate-200 p-5 space-y-4 max-w-lg">
  <div>
    <label for="nome" class="block text-sm font-medium">Nome completo</label>
    <input id="nome" name="nome" required maxlength="120" value="{{ form.nome or '' }}" autocomplete="off" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
  </div>
  <div>
    <label for="telefone" class="block text-sm font-medium">WhatsApp</label>
    <input id="telefone" name="telefone" required inputmode="tel" placeholder="(51) 99999-0000" value="{{ form.telefone or '' }}" autocomplete="off" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
    <p class="text-xs text-slate-500 mt-1">Com DDD. O número precisa ser o mesmo que o paciente usa no WhatsApp.</p>
  </div>
  <button class="rounded-lg bg-emerald-600 text-white px-4 py-2 text-sm font-medium hover:bg-emerald-700">Cadastrar</button>
  <p class="text-xs text-slate-500">Na primeira mensagem, o assistente pede o aceite do termo antes de conversar.</p>
</form>
{% endblock %}
